html, body { height: 100%; background-color: #1F2A4C; }
/*
 * Anchored to the top and given an explicit height, not `inset: 0`.
 *
 * With a translucent status bar the page covers the whole screen, and a fixed
 * element's `bottom: 0` resolves to the *safe-area* bottom rather than the
 * glass — so the app ended ~34pt short and the ground showed beneath it. That
 * only happened on the dark design, because the light ones let iOS inset the
 * web view and the two bottoms coincide. `100dvh` is the whole viewport under
 * `viewport-fit=cover`, safe areas included.
 *
 * Painted as well, so nothing shows through if the React tree measures short.
 */
#root {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 100vh;
  display: flex;
  background-color: #1F2A4C;
}
@supports (height: 100dvh) {
  html, body { height: 100dvh; }
  #root { height: 100dvh; }
}
